[project]
name = "call-analytics-platform"
version = "5.2.1"
description = "Local-first call analytics platform with shared pipeline, pilot-ready API/UI, and on-prem deployment paths"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
authors = [
    {name = "Aleksandr Mordvinov", email = "iamfuyoh@gmail.com"}
]
keywords = [
    "call-analytics",
    "voip",
    "whisper",
    "asr",
    "speech-to-text",
    "quality-analysis",
    "voice-analytics",
    "self-hosted",
    "fastapi",
    "call-center",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Operating System :: POSIX :: Linux",
]

dependencies = [
    # ⭐ ASR Core - критичные версии
    "faster-whisper==1.0.3",
    # ⭐ PyTorch with CUDA 12.4 (RTX 5090) - критичные версии
    # Требует uv.toml с index pytorch-cu124 для установки CUDA-версий
    "torch==2.5.1",
    "torchaudio==2.5.1",
    # ⭐ Configuration & Validation - критичные версии
    "pydantic==2.12.5",
    "pydantic-settings==2.7.1",
    # ⭐ Configuration & Validation - диапазоны
    "pyyaml>=6.0.0,<7.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    # ⭐ Numerical & Audio Processing - диапазоны
    "numpy>=1.26.0,<3.0.0",
    "scipy>=1.14.0,<2.0.0",
    "librosa>=0.10.0,<1.0.0",
    "soundfile>=0.12.0,<1.0.0",
    # ⭐ VLLM Client - критичная версия
    "openai==1.54.0",
    # ⭐ File System Monitoring - диапазон
    "watchdog>=4.0.0,<5.0.0",
    # ⭐ GPU Monitoring - критичная версия
    "nvidia-ml-py==12.560.30",
    # ⭐ Retry & Networking - диапазоны
    "tenacity>=8.5.0,<9.0.0",
    "httpx>=0.27.0,<1.0.0",
    # ⭐ CLI & Logging - диапазоны
    "click>=8.1.0,<9.0.0",
    "coloredlogs>=15.0.0,<16.0.0",
    "tqdm>=4.66.0,<5.0.0",
    # ⭐ Task Scheduling - диапазон
    "schedule>=1.2.0,<2.0.0",
    # ⭐ Telegram Bot - диапазон
    "python-telegram-bot>=21.7,<22.0.0",
    # ⭐ Google Sheets Integration - диапазоны
    "gspread>=6.1.0,<7.0.0",
    "google-auth>=2.36.0,<3.0.0",
    "fastapi>=0.135.1",
    "uvicorn>=0.42.0",
    "python-multipart>=0.0.22",
]

[project.urls]
Homepage = "https://scanovich.ai"
Documentation = "https://github.com/FUYOH666/Scanovich.ai-audio-call#readme"
Repository = "https://github.com/FUYOH666/Scanovich.ai-audio-call"

[project.optional-dependencies]
dev = [
    # Linting & Formatting
    "ruff>=0.1.0",
    # Type Checking
    "pyright>=1.1.0",
    # Security
    "bandit>=1.7.0",
    # Spelling
    "codespell>=2.2.0",
    # Testing
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "pytest-timeout>=2.3.0,<3.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
]

[project.scripts]
asr = "main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "PIE", # flake8-pie
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "ARG001", # unused function argument
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.12"
pythonPlatform = "Linux"
include = ["src"]
exclude = [
    "**/__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
]

typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = true
reportUnusedVariable = true
reportUnusedFunction = true
reportUnusedClass = true

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["voip", ".git", ".venv", "venv", "build", "dist"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[[tool.pip.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
