# Пример конфигурации филиалов и сотрудников
# Скопируйте этот файл в branches.yaml и заполните реальными данными

branches:
  # Пример филиала 1
  - address: "ул. Примерная д.1"
    variants:
      - "примерная 1"
      - "примерная дом 1"
      - "пр. примерная 1"
    
  # Пример филиала 2
  - address: "пр. Центральный д.25"
    variants:
      - "центральный 25"
      - "центральный проспект 25"
      - "пр-т центральный 25"

admins:
  # Пример администратора 1
  - canonical_name: "Мария"
    variants:
      - "маша"
      - "машенька"
      - "мари"
      
  # Пример администратора 2
  - canonical_name: "Александр"
    variants:
      - "саша"
      - "сашка"
      - "алекс"

