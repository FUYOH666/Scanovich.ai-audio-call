name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv sync --frozen --dev

      - name: Ruff format check
        run: |
          uv run ruff format --check .

      - name: Ruff lint
        run: |
          uv run ruff check .

      - name: Pyright type check
        run: |
          uv run pyright src/
        continue-on-error: true  # Типы могут быть неполными

      - name: Bandit security check
        run: |
          uv run bandit -r src/ -ll
        continue-on-error: true  # Может быть ложных срабатываний

      - name: Codespell
        run: |
          uv run codespell --ignore-words-list="te,adres,filial,admin" --skip="CHANGELOG.md,uv.lock,.venv/"
        continue-on-error: true  # Орфография может быть специфичной

      - name: Run tests
        run: |
          uv run pytest tests/ -v

      - name: Check for secrets
        run: |
          if [ -f ./check_security.sh ]; then
            bash ./check_security.sh
          else
            echo "check_security.sh not found, skipping"
          fi
        continue-on-error: true

