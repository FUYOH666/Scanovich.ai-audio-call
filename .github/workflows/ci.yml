name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --dev

      - name: Run ruff linter
        run: |
          uv run ruff check src/ tests/

      - name: Run ruff formatter check
        run: |
          uv run ruff format --check src/ tests/

      - name: Run pyright type checker
        run: |
          uv run pyright src/
        continue-on-error: true  # Type checking может иметь предупреждения

      - name: Run bandit security check
        run: |
          uv run bandit -r src/ -ll
        continue-on-error: true  # Security warnings не блокируют CI

      - name: Run codespell
        run: |
          uv run codespell --ignore-words-list="te,adres,filial,admin" --skip="CHANGELOG.md,uv.lock,.venv/"
        continue-on-error: true

      - name: Run pytest
        run: |
          uv run pytest tests/ -v --tb=short

      - name: Check uv.lock is up to date
        run: |
          uv lock --check
        continue-on-error: true  # Предупреждение, не блокирует CI

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv sync

      - name: Build wheel
        run: |
          uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv sync --dev

      - name: Run pip-audit
        run: |
          uv run pip-audit --desc
        continue-on-error: true  # Предупреждения не блокируют PR

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
        continue-on-error: true

